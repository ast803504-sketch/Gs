<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>واجهة التثبيت الفخمة</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* حاوية الواجهة الفخمة */
        .luxury-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            max-width: 400px;
            width: 90%;
            animation: fadeIn 1s ease-in-out;
        }

        /* عنوان فخم */
        .luxury-card h1 {
            color: #ffffff;
            font-size: 24px;
            margin-bottom: 10px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* وصف خفيف */
        .luxury-card p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 30px;
        }

        /* زر التثبيت الفخم */
        .install-btn {
            display: inline-block;
            background: linear-gradient(135deg, #6366f1 0%, #4338ca 100%);
            color: #ffffff;
            text-decoration: none;
            padding: 15px 35px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 50px;
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.4);
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            width: 100%;
        }

        .install-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px rgba(99, 102, 241, 0.6);
            background: linear-gradient(135deg, #4f46e5 0%, #3730a3 100%);
        }

        .install-btn:active {
            transform: translateY(1px);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <div class="luxury-card">
        <h1>تثبيت التطبيق</h1>
        <p>انقر أدناه لبدء عملية التثبيت الفوري</p>
        
        <!-- زر التثبيت مع الرابط والعودة السريعة لـ javascript:void(0) -->
        <a href="https://www.example.com" class="install-btn" onclick="quickRedirect(event, this.href);">تثبيت الآن</a>
    </div>

    <script>
        function quickRedirect(event, targetUrl) {
            event.preventDefault(); // منع السلوك الافتراضي المؤقت
            
            // التوجه للرابط فوراً
            window.location.href = targetUrl;
            
            // العودة الوهمية أو تفريغ الحدث إلى javascript:void(0) برمجياً إذا لزم الأمر
            setTimeout(() => {
                window.location.hash = "javascript:void(0);";
            }, 100);
        }
    </script>

</body>
</html>

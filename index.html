<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قطاع اللواء مشعل - بوابة الدخول</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: #111827;
            border: 1px solid #1f2937;
            border-top: 4px solid #d4af37;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 420px;
            padding: 30px;
            border-radius: 8px;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #f8fafc;
            font-size: 24px;
        }

        .tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 1px solid #1f2937;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            cursor: pointer;
            color: #94a3b8;
            font-weight: bold;
        }

        .tab.active {
            color: #d4af37;
            border-bottom: 2px solid #d4af37;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #cbd5e1;
        }

        input {
            width: 100%;
            padding: 12px;
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 4px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #d4af37;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: #d4af37;
            color: #0b0f19;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn:hover {
            background: #e6c547;
        }

        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
        }

        #telegram-view {
            display: none;
            text-align: center;
        }

        .telegram-card {
            background: #1a2332;
            border: 1px solid #243044;
            border-radius: 6px;
            padding: 25px;
            margin-top: 15px;
        }

        .telegram-btn {
            display: block;
            background: #229ed9;
            color: #ffffff;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 4px;
            font-weight: bold;
            margin-top: 20px;
            text-align: center;
        }

        .telegram-btn:hover {
            background: #1d8bc0;
        }

        .success-msg {
            color: #10b981;
            font-size: 14px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="auth-view">
            <h2>قطاع اللواء مشعل</h2>
            <div class="tabs">
                <div class="tab active" onclick="switchTab('login')">تسجيل دخول</div>
                <div class="tab" onclick="switchTab('register')">إنشاء حساب</div>
            </div>

            <div id="login-form" class="form-section active">
                <div class="form-group">
                    <label>اسم المستخدم العسكري</label>
                    <input type="text" placeholder="أدخل اسم المستخدم">
                </div>
                <div class="form-group">
                    <label>كلمة المرور</label>
                    <input type="password" placeholder="أدخل كلمة المرور">
                </div>
                <button class="btn" onclick="submitAuth()">دخول</button>
            </div>

            <div id="register-form" class="form-section">
                <div class="form-group">
                    <label>اسم المستخدم الجديد</label>
                    <input type="text" placeholder="اختر اسم مستخدم">
                </div>
                <div class="form-group">
                    <label>الرتبة / المعرف</label>
                    <input type="text" placeholder="أدخل الرتبة">
                </div>
                <div class="form-group">
                    <label>كلمة المرور</label>
                    <input type="password" placeholder="أنشئ كلمة مرور">
                </div>
                <button class="btn" onclick="submitAuth()">تسجيل حساب</button>
            </div>
        </div>

        <div id="telegram-view">
            <h2>بوابة القيادة</h2>
            <div class="telegram-card">
                <p class="success-msg">تم التحقق بنجاح والانضمام للنظام العسكري.</p>
                <p style="font-size: 14px; color: #94a3b8; margin-bottom: 10px;">انضم لقناة التلجرام الرسمية:</p>
                <a href="https://t.me/+NGeDAZPVE2AxZWM8" target="_blank" class="telegram-btn">انضم لقناة التلجرام</a>
            </div>
        </div>
    </div>

    <script>
        function switchTab(tabName) {
            const tabs = document.querySelectorAll('.tab');
            const forms = document.querySelectorAll('.form-section');

            tabs.forEach(t => t.classList.remove('active'));
            forms.forEach(f => f.classList.remove('active'));

            if (tabName === 'login') {
                tabs[0].classList.add('active');
                document.getElementById('login-form').classList.add('active');
            } else {
                tabs[1].classList.add('active');
                document.getElementById('register-form').classList.add('active');
            }
        }

        function submitAuth() {
            document.getElementById('auth-view').style.display = 'none';
            document.getElementById('telegram-view').style.display = 'block';
        }
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delta Executor - KSA</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-container {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            overflow: hidden;
            margin-bottom: 20px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        p {
            font-size: 14px;
            color: #9ca3af;
            text-align: center;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .btn-primary {
            width: 100%;
            padding: 16px;
            border-radius: 30px;
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            color: white;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 12px;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
            text-decoration: none;
            transition: opacity 0.2s;
        }

        .btn-secondary {
            width: 100%;
            padding: 16px;
            border-radius: 30px;
            background-color: #1a2234;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 12px;
            text-decoration: none;
            transition: background-color 0.2s;
        }

        .btn-secondary:hover {
            background-color: #242f45;
        }

        .divider {
            width: 100%;
            height: 1px;
            background-color: rgba(255, 255, 255, 0.08);
            margin: 15px 0 25px 0;
        }

        .footer-text {
            margin-top: 30px;
            font-size: 12px;
            color: #6b7280;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- الشعار الجديد -->
        <div class="logo-container">
            <img src="رابط_صورتك_هنا.png" alt="KSA Logo" id="mainImage">
        </div>

        <h1>دلتا إسكوليتر</h1>
        <p>تجربة أقوى محاكي سكربتات روبلوكس لأنظمة آيفون وأندرويد.<br>آمن، سريع، وبدون الحاجة ل computador.</p>

        <!-- الخيار الأول: التثبيت المباشر -->
        <a href="itms-services://?action=download-manifest&url=https://delta.bz/manifest.plist" class="btn-primary">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
            التثبيت المباشر (آيفون)
        </a>

        <!-- الخيار الثاني: تحميل أندرويد -->
        <a href="https://www.mediafire.com/file/k70dxqvhqkqw2q9/Delta-2.731.944.apk/file" class="btn-secondary">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path></svg>
            تحميل نسخة الأندرويد (APK)
        </a>

        <!-- الخيار الثالث: ماك أو إس -->
        <a href="#" class="btn-secondary">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
            التثبيت لأجهزة macOS
        </a>

        <div class="divider"></div>

        <!-- روابط التواصل الاجتماعي -->
        <a href="#" class="btn-secondary">قناة اليوتيوب</a>
        <a href="#" class="btn-secondary">متابعة على منصة X</a>
        <a href="#" class="btn-secondary">انضم إلى ديسكورد</a>

        <div class="footer-text">
            حقوق KSA دلتا © 2026
        </div>
    </div>

</body>
</html>

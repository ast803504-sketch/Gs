-- ========================================================
-- سكربت النزول تحت الأرض
-- حقوق النشر والتطوير: سلطان، خراب
-- ========================================================

local player = game.Players.LocalPlayer
local character = player.Character or player.CharacterAdded:Wait()
local rootPart = character:WaitForChild("HumanoidRootPart")

-- قيمة النزول (كلما زاد الرقم، زادت المسافة للأسفل)
local depthOffset = 15 

-- تنفيذ النزول تحت الأرض بسلس
local function goUnderground()
    if rootPart then
        -- حفظ الموضع الحالي مع إنقاص المحور واي (Y) لإنزال اللاعب تحت الأرض
        local currentPos = rootPart.Position
        rootPart.CFrame = CFrame.new(currentPos.X, currentPos.Y - depthOffset, currentPos.Z)
        
        -- إلغاء تفعيل الجاذبية مؤقتاً لتجنب السقوط المستمر أو الموت
        for _, part in ipairs(character:GetDescendants()) do
            if part:IsA("BasePart") then
                part.CanCollide = false
            end
        end
    end
end

-- تشغيل الوظيفة فوراً عند تنفيذ السكربت
goUnderground()

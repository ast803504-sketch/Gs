import os
from telebot import TeleBot, types

# جلب التوكن من المتغيرات البيئية أو وضعه مباشرة
TOKEN = os.getenv("BOT_TOKEN", "8743831188:AAFJiHCvGUsyih3A0fyH0D2XKoI86wJYEjw")
bot = TeleBot(TOKEN)

# معرف مالك البوت (تأكد من وضع آيدي تيليجرام الخاص بـ UMX_4 أو اسم المستخدم)
ADMIN_USERNAME = "UMX_4"

# قاموس مؤقت لتخزين بيانات المتقدمين
user_data = {}

@bot.message_handler(commands=['start'])
def send_welcome(message):
    markup = types.InlineKeyboardMarkup()
    btn_apply = types.InlineKeyboardButton("تقديم على قطاع اللواء بسام الأمني 🛡️", callback_data="start_apply")
    markup.add(btn_apply)
    
    bot.send_message(
        message.chat.id,
        "أهلاً بك في نظام التقديم الخاص بـ **قطاع اللواء بسام الامني**.\nاضغط على الزر أدناه لبدء التقديم:",
        reply_markup=markup,
        parse_mode="Markdown"
    )

@bot.callback_query_handler(func=lambda call: call.data == "start_apply")
def ask_name(call):
    bot.answer_callback_query(call.id)
    msg = bot.send_message(call.message.chat.id, "الرجاء إرسال **اسمك**:")
    bot.register_next_step_handler(msg, process_name)

def process_name(message):
    chat_id = message.chat.id
    user_data[chat_id] = {'name': message.text}
    
    msg = bot.send_message(chat_id, "ممتاز. الآن أرسل **عمرك**:")
    bot.register_next_step_handler(msg, process_age)

def process_age(message):
    chat_id = message.chat.id
    user_data[chat_id]['age'] = message.text
    
    msg = bot.send_message(chat_id, "رائع. الآن أرسل **خبراتك**:")
    bot.register_next_step_handler(msg, process_experience)

def process_experience(message):
    chat_id = message.chat.id
    user_data[chat_id]['experience'] = message.text
    
    # 1. إرسال رسالة للمتقدم بأن تقديمه قد تم إرساله
    bot.send_message(chat_id, "تم إرسال تقديمك بنجاح ✅ انتظر الرد من الإدارة.")
    
    # تجهيز البيانات للإرسال إلى المالك
    data = user_data[chat_id]
    
    admin_text = (
        f"🚨 **طلب تقديم جديد - قطاع اللواء بسام الامني**\n\n"
        f"👤 الاسم: {data['name']}\n"
        f"📅 العمر: {data['age']}\n"
        f"💼 الخبرات: {data['experience']}\n"
        f"🔗 صاحب الحساب: @{message.from_user.username or 'لا يوجد'} (ID: {chat_id})"
    )
    
    # أزرار القبول والرفض للمالك
    admin_markup = types.InlineKeyboardMarkup()
    btn_accept = types.InlineKeyboardButton("قبول ✅", callback_data=f"accept_{chat_id}")
    btn_reject = types.InlineKeyboardButton("رفض ❌", callback_data=f"reject_{chat_id}")
    admin_markup.add(btn_accept, btn_reject)
    
    # ملاحظة: يمكنك استبدال chat_id الخاص بالمالك بالآيدي الرقمي الحقيقي له لضمان وصولها مباشرة له
    # هنا يتم إرسالها لنفس البوت أو مجموعة الإدارة، ولإرسالها للمالك مباشرة ضع آيدي المالك بدل chat_id الخاص بالمتقدم إذا أردت
    bot.send_message(chat_id, f"*(معاينة للإداري / {ADMIN_USERNAME})*:\n\n" + admin_text, reply_markup=admin_markup, parse_mode="Markdown")

@bot.callback_query_handler(func=lambda call: call.data.startswith('accept_') or call.data.startswith('reject_'))
def handle_decision(call):
    action, target_chat_id = call.data.split('_')
    target_chat_id = int(target_chat_id)
    
    if action == 'accept':
        accept_msg = "تم قبولك في القطاع قطاع اللواء بسام الامني و شكرا يرجى التواصل مع UMX_4 لي ادا القسم . ✅"
        bot.send_message(target_chat_id, accept_msg)
        bot.edit_message_text("تم قبول هذا الطلب بنجاح ✅", call.message.chat.id, call.message.message_id)
    elif action == 'reject':
        reject_msg = "تم رفض تقديم لي عددت أسباب و شكرا ❌"
        bot.send_message(target_chat_id, reject_msg)
        bot.edit_message_text("تم رفض هذا الطلب ❌", call.message.chat.id, call.message.message_id)

if __name__ == '__main__':
    print("Bot is running...")
    bot.infinity_polling()
